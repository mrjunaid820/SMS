<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pak School ERP | Professional School Management System</title>
    <!-- Google Fonts for clean Inter & Urdu/Pakistani friendly typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans">
    <div id="root">
      <!-- Instant Branded Pre-Bundle Loading Shell (Prevents White Screen Flash) -->
      <style>
        #sms-pre-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0f172a;
          color: #f8fafc;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          z-index: 999999;
          transition: opacity 0.3s ease;
        }
        .sms-brand-crest {
          width: 76px;
          height: 76px;
          border-radius: 20px;
          background: linear-gradient(135deg, #1e293b 0%, #090d16 100%);
          border: 1.5px solid rgba(234, 179, 8, 0.4);
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(234, 179, 8, 0.15);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 20px;
          animation: sms-crest-pulse 2.2s infinite ease-in-out;
        }
        @keyframes sms-crest-pulse {
          0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(234, 179, 8, 0.15); }
          50% { transform: scale(1.04); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7), 0 0 25px rgba(234, 179, 8, 0.3); }
        }
        .sms-loader-title {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #ffffff;
          margin: 0 0 4px 0;
          text-align: center;
        }
        .sms-loader-subtitle {
          font-size: 13px;
          color: #94a3b8;
          font-weight: 500;
          margin: 0 0 24px 0;
          text-align: center;
        }
        .sms-spinner-track {
          width: 140px;
          height: 4px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        }
        .sms-spinner-bar {
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          width: 45%;
          background: linear-gradient(90deg, #2563eb, #38bdf8, #eab308);
          border-radius: 9999px;
          animation: sms-slide 1.4s infinite ease-in-out;
        }
        @keyframes sms-slide {
          0% { left: -45%; width: 30%; }
          50% { width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
      <div id="sms-pre-loader">
        <div class="sms-brand-crest">
          <!-- Institutional Emblem SVG -->
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="sms-loader-title">Islamia Public High School</h1>
        <p class="sms-loader-subtitle">Loading School Management System...</p>
        <div class="sms-spinner-track">
          <div class="sms-spinner-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
